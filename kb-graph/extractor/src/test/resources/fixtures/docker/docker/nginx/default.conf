server {
    listen 80;

    location /sso/ {
        resolver 127.0.0.11 valid=10s;
        set $sso http://sso-mock:8090;
        proxy_pass $sso;
    }

    location /web/crm/blacklist {
        return 302 /crm/blacklist/search;
    }

    location /crm/ {
        proxy_pass http://crm-web:8080;
        proxy_set_header Host $http_host;
    }

    location = / {
        return 302 /web/crm/blacklist;
    }

    location / {
        proxy_pass http://liferay:8080;
    }
}
